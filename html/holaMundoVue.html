<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo VUE</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>

<body>
    <!--Vue tendra control Absoluto de toda mi sección-->

    <div id="myApp">
        <header></header>
        <nav></nav>
        <section>
            <h1>Hola mundo desde Vue.JS</h1>
            <p> {{1+1}} </p>
            <p> {{[1,2,3,4,5]}} </p>
            <p> {{true?'True': 'False'}} </p>
            <p>{{mensaje}}</p>
            <p>{{valor}}</p>


            <button v-on:click="cambiarTexto">Cambiar texto</button>
            <button v-on:click="sumar">Sumar</button>

        </section>
        <footer></footer>
    </div>

    <!--Fuera del control de VUE, no lo tranforma en codigo js-->
    <p>{{valor}}</p>
    <p> {{1+1}} </p>
    <script src="../js/app.js"></script>

</body>

</html>
