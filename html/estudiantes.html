<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo VUE</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>

<body>
    <!--Vue tendra control Absoluto de toda mi sección-->

    <div id="myApp">
        <header></header>
        <nav></nav>
        <section>

            <label for="idNombre">Nombre: </label>
            <input v-model="nombre" type="text" id="idNombre">
            <label for="idApellido">Apellido: </label>
            <input @keypress.enter="agregar2" v-model="apellido" type="text" id="idApellido">

            <!--<button v-on:click="agregar"> Agregar</button> -->


            <ul>
                <!--    <li> {{lista[0].nombre}} A: {{lista[0].apellido}} <br> </li>
                <li> {{lista[1]}} <br></li>
                <li> {{lista[2]}} <br></li>
                <li> {{lista[3]}} <br></li>
                <li> {{lista[4]}} <br></li> -->

                <li v-for="({nombre,apellido}, index) in lista">
                    <h3 v-if="nombre!==null">{{index+1}}-{{nombre}}</h3>
                    <h4 v-if="apellido!==undefined">{{index+1}}-{{apellido}}</h4>
                </li>
            </ul>
        </section>
        <footer></footer>
    </div>

    <script src="../js/app.js"></script>

</body>

</html>
